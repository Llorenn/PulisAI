<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - PulisAI</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .footer .image-credit {
        font-size: 0.8em;
        color: #e0e0e0;
        margin-top: 5px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;

        background-image: url("{{ url_for('static', filename='images/pnp.jpeg') }}");
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        background-blend-mode: multiply;
        background-color: rgba(0, 0, 0, 0.322); /* darkens the photo behind the card */

        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        overflow: hidden;
      }

      .login-container {
        width: 100%;
        max-width: 420px;
      }

      .card {
        background: rgba(255, 255, 255, 0.8);
        border-radius: 16px;

        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);

        border: 1px solid rgba(255, 255, 255, 0.5);

        box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);

        padding: 40px;
        animation: fadeIn 0.5s ease-in;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        text-align: center;
        margin-bottom: 30px;
      }

      .logo h1 {
        font-size: 2.5em;
        font-weight: 700;
        color: #0d1b2a;
        margin: 0;
      }

      .logo p {
        font-size: 1.1em;
        color: #555;
        margin-top: 5px;
      }

      /* Error message */
      .error-message {
        background-color: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
        padding: 12px 15px;
        border-radius: 4px;
        margin-bottom: 20px;
        text-align: center;
        font-weight: 500;
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #333;
      }

      /* Inputs */
      .form-group input {
        width: 100%;
        padding: 12px 15px;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1em;
        color: #333;
        transition: border-color 0.2s ease, background-color 0.2s ease;
      }

      .form-group input::placeholder {
        color: #888;
      }

      .form-group input:focus {
        outline: none;
        border-color: #004085;
        background-color: #fff;
        box-shadow: 0 0 0 2px rgba(0, 64, 133, 0.1);
      }

      .password-toggle {
        position: relative;
      }

      .password-toggle-btn {
        position: absolute;
        top: 50%;
        right: 15px;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        font-size: 0.9em;
        font-weight: 600;
        color: #004085;
        padding: 0;
      }

      .btn-primary {
        width: 100%;
        padding: 14px;
        background-color: #004085;
        border: none;
        border-radius: 4px;
        color: white;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s ease;
        margin-top: 10px;
      }

      .btn-primary:hover {
        background-color: #00336a;
      }

      .footer {
        text-align: center;
        margin-top: 25px;
        color: #ffffff;
        font-size: 0.9em;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="card">
        <div class="logo">
          <h1>PulisAI</h1>
          <p>Angeles City Crime Analysis Portal</p>
        </div>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form action="{{ url_for('login') }}" method="POST">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Enter your username"
              required
              autofocus
            />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-toggle">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
              />
              <button
                type="button"
                class="password-toggle-btn"
                onclick="togglePassword()"
              >
                Show
              </button>
            </div>
          </div>

          <button type="submit" class="btn-primary">Login</button>
        </form>
      </div>

      <div class="footer">
            <p>&copy; 2025 PulisAI - Angeles City Crime Analysis</p>
            <p class="image-credit">Background image courtesy of the PNP Facebook Page</p>
    </div>

    <script>
      function togglePassword() {
        const passwordInput = document.getElementById("password");
        const toggleBtn = document.querySelector(".password-toggle-btn");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
          toggleBtn.textContent = "Hide";
        } else {
          passwordInput.type = "password";
          toggleBtn.textContent = "Show";
        }
      }

      window.addEventListener("load", function () {
        document.getElementById("username").focus();
      });
    </script>
  </body>
</html>
